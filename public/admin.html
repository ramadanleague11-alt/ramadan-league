<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>

<h2>Add Winner</h2>

<input type="text" id="playerName" placeholder="Player Name">
<input type="text" id="category" placeholder="Category">
<input type="text" id="correctAnswer" placeholder="Correct Answer">
<select id="rank">
  <option value="1">1st</option>
  <option value="2">2nd</option>
</select>

<button id="addWinner">Add Winner</button>
<button id="finalizeDay">Finalize Day</button>

<script type="module">
import { db } from "./firebaseConfig.js";
import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { finalizeDay } from "./scoreEngine.js";

document.getElementById("addWinner").addEventListener("click", async () => {
  const name = document.getElementById("playerName").value;
  const category = document.getElementById("category").value;
  const correctAnswer = document.getElementById("correctAnswer").value;
  const rank = parseInt(document.getElementById("rank").value);

  const today = new Date().toISOString().split("T")[0];

  await addDoc(collection(db,"winnersManual"), {
    name,
    category,
    correctAnswer,
    rank,
    day: today
  });

  alert("Winner Added!");
});

document.getElementById("finalizeDay").addEventListener("click", finalizeDay);
</script>

</body>
</html>
