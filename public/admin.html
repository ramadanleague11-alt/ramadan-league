<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  </head>
<body>

  <div class="admin-card">
    <h2>🌙 Add New Winner</h2>
    <button id="addWinner">Add to Temporary List</button>
    <button id="finalizeDay">Finalize Day & Give Points ✨</button>
    
    <button id="uploadOldWinners" style="background: #3b82f6; color: white; margin-top: 20px; width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer;">
      رفع بيانات الفائزين القدامى 🚀
    </button>
  </div>

  <script type="module">
    import { db } from "./firebaseInit.js";
    import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { finalizeDay } from "./scoreEngine.js";

    // 1. كود إضافة فائز جديد (المؤقت)
    document.getElementById("addWinner").addEventListener("click", async () => {
      // الكود الخاص بك هنا...
    });

    // 2. ربط زر إنهاء اليوم
    document.getElementById("finalizeDay").addEventListener("click", finalizeDay);

    // 3. كود رفع الفائزين القدامى (يُوضع هنا داخل السكريبت)
    document.getElementById("uploadOldWinners").addEventListener("click", async () => {
      const oldWinners = [
        { name: "Gammachiis Saido", points: 5 },
        { name: "Sumeya Hassan", points: 5 },
        { name: "Ali Abdullah", points: 4 },
        { name: "Ramadan Mo", points: 4 },
        { name: "Naafija Khalifa", points: 3 },
        { name: "Muaz Habibi", points: 2 },
        { name: "3issaa Abdullah", points: 2 },
        { name: "Emad", points: 2 },
        { name: "Mubarak Anwar", points: 2 },
        { name: "Enoal Ismael", points: 2 },
        { name: "Soreti Said", points: 2 },
        { name: "Eyman Sharaf", points: 1 }
      ];

      try {
        for (const winner of oldWinners) {
          await addDoc(collection(db, "users"), {
            name: winner.name,
            points: winner.points
          });
        }
        alert("تم رفع جميع الفائزين بنجاح! 🎉");
      } catch (e) {
        alert("حدث خطأ: " + e.message);
      }
    });
  </script>
</body>
</html>
