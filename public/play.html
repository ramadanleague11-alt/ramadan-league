<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Results | Ramadan League</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* التنسيقات الإضافية فقط للنتائج */
        body {
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            padding: 40px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .results-title {
            font-size: 28px;
            margin-bottom: 30px;
        }

        /* حاوية الكروت */
        #resultsContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        /* البوكس المربع الأسود الصريح */
        .card {
            background-color: #000000 !important; /* أسود صريح */
            border: 1px solid rgba(255, 255, 255, 0.3); /* إطار أبيض نحيف وباين */
            border-radius: 12px;
            padding: 25px;
            width: 320px;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* الفئة باللون الذهبي */
        .category {
            font-size: 22px;
            font-weight: bold;
            color: #facc15; /* ذهبي */
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .category small {
            font-size: 14px;
            color: #ffffff;
            opacity: 0.8;
            margin-left: 5px;
        }

        /* أسماء الفائزين */
        .winner {
            font-size: 18px;
            margin: 8px 0;
            color: #ffffff;
            text-align: left;
        }

        /* الخط الفاصل الأبيض النحيف */
        .divider {
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            margin: 15px 0;
            width: 100%;
        }

        /* منطقة الإجابة الصحيحة - تمنع خروج النص */
        .answer-box {
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .correct-label {
            font-size: 12px;
            color: #cccccc;
            display: block;
            margin-bottom: 8px;
        }

        .correct-val {
            font-size: 16px;
            color: #ffffff;
            line-height: 1.5;
            word-wrap: break-word; /* يكسر الكلمات الطويلة */
            overflow-wrap: break-word; /* يضمن بقاء النص داخل الصندوق */
            max-width: 100%;
        }

        /* زر الرجوع */
        .btn-back {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* زر الترتيب العام والفوتر */
        .footer-nav {
            margin-top: 60px;
            padding-bottom: 40px;
        }

        .view-overall-btn {
            color: #facc15;
            border: 1px solid #facc15;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .view-overall-btn:hover {
            background: #facc15;
            color: #000;
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="btn-back"><span>←</span> Back to Home</a>
        
        <div class="results-title">🌙 Today's Official Results</div>
        
        <div id="resultsContainer">
            </div>

        <div class="footer-nav">
            <a href="leaderboard.html" class="view-overall-btn">View Overall Ranking 🏆</a>
            <footer>
                © 2026 Ramadan League | All Rights Reserved
            </footer>
        </div>
    </div>

    <script type="module" src="play.js"></script>
</body>
</html>
