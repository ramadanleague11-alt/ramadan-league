<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Results</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    .results-title {
      font-size: 28px;
      margin-bottom: 30px;
    }

    .card {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .category {
      font-size: 20px;
      margin-bottom: 10px;
      color: gold;
    }

    .winner {
      font-size: 18px;
      margin: 5px 0;
    }

    .correct {
      margin-top: 10px;
      font-style: italic;
      color: #ccc;
    }

    a {
      color: gold;
      text-decoration: none;
    }
.btn-back {
    /* التموضع */
    display: inline-flex;
    align-items: center;
    gap: 8px; /* مسافة بين السهم والنص */
    margin: 20px; /* مسافة من الحواف */
    
    /* الشكل والألوان */
    background-color: rgba(255, 255, 255, 0.05); /* خلفية داكنة جداً وشفافة */
    color: #e0e0e0; /* لون نص فاتح */
    padding: 8px 16px;
    border-radius: 50px; /* تجعل الزر بشكل كبسولة مثل الصورة */
    border: 1px solid rgba(255, 255, 255, 0.3); /* إطار رفيع ولطيف */
    
    /* الخط والتنسيق */
    text-decoration: none;
    font-size: 14px;
    font-family: sans-serif;
    transition: all 0.3s ease;
}

/* تأثير الهوفر (عند مرور الماوس) */
.btn-back:hover {
    background-color: rgba(255, 255, 255, 0.15); /* تفتيح الخلفية قليلاً */
    border-color: rgba(255, 255, 255, 0.6); /* تفتيح الإطار */
    transform: translateY(-2px); /* رفعة بسيطة للأعلى */
}
         
  </style>
</head>
<body>
<a href="index.html" class="btn-back">
    <span>←</span> Back to Home
</a>
<div class="container">
  <h1>🌙 Ramadan League</h1>
  <div class="results-title">Today's Official Results</div>
  <div id="resultsContainer"></div>
  <br>
  <a href="leaderboard.html">View Overall Ranking</a>
</div>

<script type="module" src="play.js"></script>
</body>
</html>
